[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-ops-lab"
version = "0.1.0"
description = "OTA update, rollback, SBOM and reproducible builds for constrained edge fleets."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Thierry Sayegh-Sauvage" }]
keywords = ["ota", "rollback", "sbom", "reproducible-builds", "edge", "fleet-management"]

# No runtime dependencies. This package models an update process; it does not
# ship a key store, an HTTP client or a container runtime, because every fleet
# already has its own and the ones it has are the ones it will use.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.6",
    "mypy>=1.10",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[project.scripts]
fol = "fleet_ops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
# Tiers, so a gate can select one. The names are the contract with the Makefile
# and with CI; renaming one silently disables a job.
markers = [
    "smoke: does it start at all — seconds, no fleet, run first",
    "unit: one behaviour of one module, at its boundary",
    "functional: a requirement from docs/FUNCTIONAL_SPEC.md, end to end",
    "security: input handling, path safety, and what must not be trusted",
    "pentest: adversarial — attacks on the two rules, not exercises of them",
    "hardware: requires a real board with two slots; skipped unless FOL_HARDWARE is set",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "scripts"]
